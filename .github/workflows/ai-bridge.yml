name: AI bridge

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ai-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run bridge
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHAT_CODE: ${{ secrets.CHAT_CODE }}
        run: node tools/ai-bridge.js
